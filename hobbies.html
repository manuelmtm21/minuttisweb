<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies</title>
    <style>
        body {
            background-color: #7A9F35;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .contenido {
            animation: fadeIn 1s ease-in-out;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
            flex: 1;
            padding: 0 20px;
        }
        td {
            text-align: center;
            padding: 15px;
            vertical-align: middle;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        td:hover {
            transform: scale(1.05);
            color: #063116;
        }
        img {
            width: 90%;
            max-width: 400px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        img:hover {
            transform: scale(1.05);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.5);
        }
        td div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-top: 10px;
        }
        td p {
            margin: 10px 0 0;
            font-size: 20px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .td:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            color: #063116;
        }
        footer {
            background-color: #354F00;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-weight: normal;
            margin-top: auto;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.3);
        }
        footer p {
            margin: 0;
            font-weight: normal;
            font-size: 16px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            z-index: -1;
            animation: animateBackground 10s infinite alternate;
        }
        @keyframes animateBackground {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }
    </style>
    <script>
        function openInNewTab(url) {
            window.open(url, '_blank');
        }
    </script>
</head>
<body>
<table class="contenido">
<tr>
    <td class="contenido">
        <div><img src="hobbies/hobbie1.jpg" alt="Hobbie 1" onclick="openInNewTab('https://youtu.be/G1atkq4C1KU?si=dD1jDBkPjvi4KnM7')">
            <p>Jugar Video Juegos</p></div></td>
    <td><div> <img src="hobbies/hobbie2.jpg" alt="Hobbie 2" onclick="openInNewTab('https://www.youtube.com/watch?v=JuBBIJ7adjM')">
            <p>Ver Peleas De MMA</p></div></td>
    <td><div> <img src="hobbies/hobbie3.jpg" alt="Hobbie 3" onclick="openInNewTab('https://open.spotify.com/intl-es/track/4J2HQow52pFt9olOHnYTbk?si=b9459086e4114d98')">
            <p>Escuchar Música</p></div></td></tr>
    <tr><td><div> <img src="hobbies/hobbie4.jpg" alt="Hobbie 4" onclick="openInNewTab('https://www.netflix.com/title/81444051')">
            <p>Ver Películas y Series</p></div></td>
    <td><div> <img src="hobbies/hobbie5.jpg" alt="Hobbie 5" onclick="openInNewTab('https://www.marvel.com/comics')">
            <p>Leer Comics</p></div></td>
    <td> <div><img src="hobbies/hobbie6.jpg" alt="Hobbie 6" onclick="openInNewTab('https://youtu.be/iys_pmJSp9M?si=KC8c_wmYiC3M2uQb')">
            <p>Acampar</p></div></td></tr>
</table>

</body>
</html>
